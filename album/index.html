<!DOCTYPE html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ئەلبومی وێنەکان — قورئانی پیرۆز</title>
    <meta name="description" content="وێنەکانی پێغەمبەران موحەممەد (د.خ)، عیسا (د.خ) و مووسا (د.خ).">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- The photo album (see ALBUM.md). Like the 3D simulations it is in Central Kurdish, Arabic
         and English: the home page hands over its language on the link (?lang=), and a reader
         who comes straight here gets the language they last picked on the site, or Kurdish. -->
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("/fonts/vazirmatn/Vazirmatn-v33.003-wght.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFC, U+200C-200D;
      }

      :root {
        --brand: #A97D19;
        --on-brand: #FFFFFF;
        --bg: #F7F7FA;
        --surface: #FFFFFF;
        --text: #1D2231;
        --muted: #5B6272;
        --border: rgba(29, 34, 49, 0.14);
        --tile: #ECEAE4;
        --viewer: #0E1016;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #E2BD37;
          --on-brand: #1A1405;
          --bg: #12141C;
          --surface: #1D2231;
          --text: #F4F4F5;
          --muted: #A9AEBD;
          --border: rgba(226, 189, 55, 0.18);
          --tile: #1A1E2A;
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Vazirmatn, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      [hidden] { display: none !important; }

      .wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
      @media (min-width: 720px) { .wrap { padding: 0 32px; } }

      /* Header: the way back to the site, and one tab per prophet. */
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        -webkit-backdrop-filter: saturate(1.2) blur(12px);
        backdrop-filter: saturate(1.2) blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .top .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px 16px;
        min-height: 64px;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        min-width: 0;
      }

      .back img { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); flex: none; }
      .back svg { width: 18px; height: 18px; flex: none; color: var(--brand); }
      [dir="rtl"] .back svg { transform: scaleX(-1); }
      .back:hover span { text-decoration: underline; text-underline-offset: 3px; }

      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        max-width: 100%;
        overflow-x: auto;
      }

      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 7px 16px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .tab:hover { color: var(--text); }
      .tab[aria-selected="true"] { background: var(--brand); color: var(--on-brand); }
      .tab .n { font-size: 12px; font-weight: 500; opacity: 0.8; font-variant-numeric: tabular-nums; }

      /* On a phone the three names fill the bar; their counts are under the heading anyway. */
      @media (max-width: 480px) {
        .tabs { width: 100%; }
        .tab { flex: 1 1 auto; justify-content: center; padding: 7px 8px; font-size: 13px; }
        .tab .n { display: none; }
      }

      .tab:focus-visible,
      .tile:focus-visible,
      .back:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      /* The prophet's name above the pictures. */
      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 32px 0 20px;
      }

      .intro__label { width: 100%; margin: 0; color: var(--brand); font-size: 14px; font-weight: 700; }
      .intro h1 { margin: 0; font-size: clamp(36px, 7vw, 60px); line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; }
      .intro__accent { font-size: clamp(28px, 5vw, 44px); line-height: 1.3; font-weight: 700; color: var(--brand); }
      .intro__count { width: 100%; margin: 0; color: var(--muted); font-size: 14px; }

      /* Masonry: CSS columns keep each picture at its own height. */
      .grid { columns: 2 150px; column-gap: 8px; padding-bottom: 40px; }
      @media (min-width: 720px) { .grid { columns: 4 200px; column-gap: 12px; } }
      @media (min-width: 1200px) { .grid { columns: 5 230px; } }

      .tile {
        display: block;
        width: 100%;
        margin: 0 0 8px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        overflow: hidden;
        background: var(--tile);
        cursor: zoom-in;
        break-inside: avoid;
      }

      @media (min-width: 720px) { .tile { margin-bottom: 12px; } }
      .tile img { display: block; width: 100%; height: auto; transition: transform 0.35s ease; }
      .tile:hover img { transform: scale(1.025); }

      footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 20px 0 32px; text-align: center; }
      footer a { color: inherit; }

      /* The full-size viewer. */
      .viewer {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--viewer);
        color: #F4F4F5;
      }

      .viewer__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; font-size: 14px; }
      [dir="rtl"] .viewer__bar { padding: 10px 16px 10px 12px; }
      .viewer__title { color: #C9CDD8; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .viewer__title b { color: #FFFFFF; font-weight: 700; }

      .icon-btn {
        appearance: none;
        width: 44px;
        height: 44px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #F4F4F5;
        cursor: pointer;
      }

      .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
      .icon-btn:focus-visible { outline: 2px solid #E2BD37; outline-offset: 2px; }
      .icon-btn svg { width: 22px; height: 22px; }

      .viewer__stage { position: relative; min-height: 0; }

      .viewer__img {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: calc(100% - 16px);
        max-height: calc(100% - 16px);
        border-radius: 6px;
        user-select: none;
        -webkit-user-drag: none;
      }

      @media (min-width: 601px) { .viewer__img { max-width: calc(100% - 136px); } }

      .viewer__nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.35); }
      .viewer__prev { inset-inline-start: 12px; }
      .viewer__next { inset-inline-end: 12px; }
      [dir="rtl"] .viewer__nav svg { transform: scaleX(-1); }
      @media (max-width: 600px) { .viewer__nav { display: none; } }

      @media (prefers-reduced-motion: reduce) {
        .tile img, .tab { transition: none; }
        .tile:hover img { transform: none; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="back" href="/" id="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <img src="/logo.png" alt="" width="32" height="32">
          <span id="back-text">گەڕانەوە بۆ ماڵپەڕە سەرەکییەکە</span>
        </a>
        <nav class="tabs" id="tabs" role="tablist"></nav>
      </div>
    </header>

    <main class="wrap">
      <section class="intro" aria-live="polite">
        <p class="intro__label" id="album-title">ئەلبومی وێنەکان</p>
        <h1 id="name"></h1>
        <div class="intro__accent" id="accent" lang="ar" dir="rtl"></div>
        <p class="intro__count" id="count"></p>
      </section>
      <section class="grid" id="grid" aria-labelledby="name"></section>
    </main>

    <footer>
      <div class="wrap">© <span id="year"></span> <a href="/" id="site-name">قورئانی پیرۆز — پەڕتووکی خودا</a></div>
    </footer>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
      <div class="viewer__bar">
        <div class="viewer__title" id="viewer-title"></div>
        <button class="icon-btn" id="viewer-close" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="viewer__stage" id="viewer-stage">
        <img class="viewer__img" id="viewer-img" alt="">
        <button class="icon-btn viewer__nav viewer__prev" id="viewer-prev" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn viewer__nav viewer__next" id="viewer-next" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <script src="/album/photos.js"></script>
    <script>
      (function () {
        'use strict';

        var STRINGS = {
          ckb: {
            pageTitle: 'ئەلبومی وێنەکان — قورئانی پیرۆز',
            album: 'ئەلبومی وێنەکان',
            back: 'گەڕانەوە بۆ ماڵپەڕە سەرەکییەکە',
            site: 'قورئانی پیرۆز — پەڕتووکی خودا',
            tabs: 'پێغەمبەران',
            count: '{n} وێنە',
            picture: 'وێنەی {i} لە {n}',
            viewer: 'پیشاندەری وێنە',
            close: 'داخستن',
            prev: 'وێنەی پێشوو',
            next: 'وێنەی دواتر',
            names: { muhammad: 'موحەممەد (د.خ)', jesus: 'عیسا (د.خ)', moses: 'مووسا (د.خ)' }
          },
          ar: {
            pageTitle: 'ألبوم الصور — قرآني بيروز',
            album: 'ألبوم الصور',
            back: 'العودة إلى الموقع الرئيسي',
            site: 'قرآني بيروز — كتاب الله',
            tabs: 'الأنبياء',
            count: 'عدد الصور: {n}',
            picture: 'الصورة {i} من {n}',
            viewer: 'عارض الصور',
            close: 'إغلاق',
            prev: 'الصورة السابقة',
            next: 'الصورة التالية',
            names: { muhammad: 'محمد ﷺ', jesus: 'عيسى', moses: 'موسى' }
          },
          en: {
            pageTitle: 'Photo Album — Qurany Piroz',
            album: 'Photo Album',
            back: 'Return to the website',
            site: 'Qurany Piroz — The Book of God',
            tabs: 'Prophets',
            count: '{n} pictures',
            picture: 'Picture {i} of {n}',
            viewer: 'Picture viewer',
            close: 'Close',
            prev: 'Previous picture',
            next: 'Next picture',
            names: { muhammad: 'Muhammad', jesus: 'Jesus', moses: 'Moses' }
          }
        };

        // Shown beside the name in Kurdish and English; the Arabic page has it as the name itself.
        var ACCENT = { muhammad: 'مُحَمَّد ﷺ', jesus: 'عيسى', moses: 'موسى' };

        // ?lang= from the home page first; then the language last picked on the site (i18n.js
        // keeps it as qp-lang), the other Kurdish dialects reading Central Kurdish and every
        // other language English, as the 3D simulations do.
        function pickLang() {
          var asked = new URLSearchParams(location.search).get('lang');
          var stored = null;
          try { stored = localStorage.getItem('qp-lang'); } catch (e) {}
          var l = asked || stored || 'ckb';
          if (STRINGS[l]) return l;
          if (l === 'kmr' || l === 'sdh') return 'ckb';
          return 'en';
        }

        var lang = pickLang();
        var S = STRINGS[lang];
        var rtl = lang !== 'en';
        var ARABIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';

        function num(n) {
          var s = String(n);
          return rtl ? s.replace(/[0-9]/g, function (d) { return ARABIC_DIGITS[d]; }) : s;
        }

        function fill(template, values) {
          return template.replace(/\{(\w+)\}/g, function (_, k) { return num(values[k]); });
        }

        var $ = function (id) { return document.getElementById(id); };
        var root = document.documentElement;
        root.lang = lang;
        root.dir = rtl ? 'rtl' : 'ltr';
        document.title = S.pageTitle;
        $('back-text').textContent = S.back;
        $('album-title').textContent = S.album;
        $('site-name').textContent = S.site;
        $('year').textContent = num(new Date().getFullYear());
        $('tabs').setAttribute('aria-label', S.tabs);
        $('viewer').setAttribute('aria-label', S.viewer);
        $('viewer-close').setAttribute('aria-label', S.close);
        $('viewer-prev').setAttribute('aria-label', S.prev);
        $('viewer-next').setAttribute('aria-label', S.next);
        if (lang !== 'ckb') $('back').href = '/?lang=' + lang;

        var ALBUM = window.QPAlbum || [];
        var tabs = $('tabs'), grid = $('grid'), viewer = $('viewer'), img = $('viewer-img');
        var current = null, index = -1, lastFocus = null;

        function thumbSrc(sec, item) { return '/album/thumbs/' + sec.key + '/' + item[0] + '.webp'; }
        function fullSrc(sec, item) { return '/album/images/' + sec.key + '/' + item[0] + '.webp'; }

        ALBUM.forEach(function (sec) {
          var b = document.createElement('button');
          b.className = 'tab';
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.dataset.key = sec.key;
          var label = document.createElement('span');
          label.textContent = S.names[sec.key];
          var n = document.createElement('span');
          n.className = 'n';
          n.textContent = num(sec.items.length);
          b.append(label, n);
          b.addEventListener('click', function () { location.hash = sec.key; });
          tabs.appendChild(b);
        });

        function showSection(sec) {
          current = sec;
          Array.prototype.forEach.call(tabs.children, function (b) {
            b.setAttribute('aria-selected', String(b.dataset.key === sec.key));
          });
          $('name').textContent = S.names[sec.key];
          $('accent').textContent = lang === 'ar' ? '' : ACCENT[sec.key];
          $('count').textContent = fill(S.count, { n: sec.items.length });
          document.title = S.names[sec.key] + ' — ' + S.pageTitle;
          var frag = document.createDocumentFragment();
          sec.items.forEach(function (item, i) {
            var b = document.createElement('button');
            b.className = 'tile';
            b.type = 'button';
            b.dataset.i = i;
            var im = document.createElement('img');
            im.src = thumbSrc(sec, item);
            im.width = item[1];
            im.height = item[2];
            im.loading = i < 10 ? 'eager' : 'lazy';
            im.decoding = 'async';
            im.alt = S.names[sec.key] + ' — ' + fill(S.picture, { i: i + 1, n: sec.items.length });
            b.appendChild(im);
            frag.appendChild(b);
          });
          grid.replaceChildren(frag);
        }

        grid.addEventListener('click', function (e) {
          var t = e.target.closest('.tile');
          if (t) open(+t.dataset.i, t);
        });

        function open(i, from) {
          lastFocus = from || document.activeElement;
          viewer.hidden = false;
          document.body.style.overflow = 'hidden';
          go(i);
          $('viewer-close').focus();
        }

        function close() {
          viewer.hidden = true;
          index = -1;
          document.body.style.overflow = '';
          img.removeAttribute('src');
          history.replaceState(null, '', '#' + current.key);
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        function go(i) {
          var sec = current, items = sec.items;
          index = (i + items.length) % items.length;
          var item = items[index], want = index;
          // The thumbnail at once, then the full picture as soon as it has arrived.
          img.src = thumbSrc(sec, item);
          img.alt = S.names[sec.key] + ' — ' + fill(S.picture, { i: index + 1, n: items.length });
          var full = new Image();
          full.onload = function () { if (index === want && current === sec) img.src = full.src; };
          full.src = fullSrc(sec, item);
          [1, -1].forEach(function (d) { new Image().src = fullSrc(sec, items[(index + d + items.length) % items.length]); });
          var title = $('viewer-title');
          title.textContent = '';
          var b = document.createElement('b');
          b.textContent = S.names[sec.key];
          title.append(b, '  ' + num(index + 1) + ' / ' + num(items.length));
          history.replaceState(null, '', '#' + sec.key + '/' + (index + 1));
        }

        $('viewer-close').addEventListener('click', close);
        $('viewer-prev').addEventListener('click', function () { go(index - 1); });
        $('viewer-next').addEventListener('click', function () { go(index + 1); });
        $('viewer-stage').addEventListener('click', function (e) { if (e.target === e.currentTarget) close(); });

        document.addEventListener('keydown', function (e) {
          if (viewer.hidden) return;
          // The arrow pointing the way the page reads moves forward.
          var forward = rtl ? 'ArrowLeft' : 'ArrowRight';
          var backward = rtl ? 'ArrowRight' : 'ArrowLeft';
          if (e.key === 'Escape') close();
          else if (e.key === forward) go(index + 1);
          else if (e.key === backward) go(index - 1);
          else if (e.key === 'Tab') {
            var f = Array.prototype.filter.call(viewer.querySelectorAll('button'), function (el) { return el.offsetParent !== null; });
            if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
          }
        });

        var touchX = null;
        viewer.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
        viewer.addEventListener('touchend', function (e) {
          if (touchX === null) return;
          var dx = e.changedTouches[0].clientX - touchX;
          touchX = null;
          if (Math.abs(dx) < 50) return;
          // Swiping against the reading direction brings in the next picture, as in a book.
          var forward = rtl ? dx > 0 : dx < 0;
          go(index + (forward ? 1 : -1));
        });

        function route() {
          if (!ALBUM.length) return;
          var parts = location.hash.slice(1).split('/');
          var sec = ALBUM.filter(function (s) { return s.key === parts[0]; })[0];
          if (!sec) {
            history.replaceState(null, '', location.pathname + location.search + '#' + ALBUM[0].key);
            sec = ALBUM[0];
          }
          if (sec !== current) {
            if (!viewer.hidden) close();
            showSection(sec);
            window.scrollTo(0, 0);
          }
          var i = parseInt(parts[1], 10);
          if (i >= 1 && i <= sec.items.length) {
            if (viewer.hidden) open(i - 1, grid.children[i - 1]); else go(i - 1);
          } else if (!viewer.hidden) {
            close();
          }
        }

        window.addEventListener('hashchange', route);
        route();
      })();
    </script>
  </body>
</html>
