<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39;; style-src &#39;self&#39;; img-src &#39;self&#39; data: blob:; font-src &#39;self&#39; data:; connect-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;self&#39;; form-action &#39;none&#39;">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030714" />
    <meta name="description" content="A 3D Earth with the world's great mosques, showing that each of the five prayers is always being prayed somewhere on Earth." />
    <title>AllMosques</title>
    <link rel="icon" type="image/svg+xml" href="/mosques/favicon.svg" />
    <!-- The Earth's first, small picture (44 KB), fetched alongside the scripts. -->
    <link rel="preload" href="/mosques/earth/earth-1k.webp" as="fetch" type="image/webp" crossorigin="anonymous" />
    <script type="module" crossorigin src="/mosques/assets/index-BFnhpD2L.js"></script>
    <link rel="modulepreload" crossorigin href="/mosques/assets/three-hukM0Ual.js">
    <link rel="stylesheet" crossorigin href="/mosques/assets/index-B20A_uwg.css">
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true">🕌</span><div><b>AllMosques</b><span class="tagline"></span></div></div>
      <div class="top-end">
        <!-- Shown only when the app is built into another website (VITE_WEBSITE_URL). -->
        <a id="home" class="home" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><span></span></a>
        <div class="lang" role="group"></div>
      </div>
    </header>
    <main class="app">
      <section class="stage">
        <div id="globe" class="globe" role="img"></div>
        <div id="tip" class="tip" hidden></div>
        <div class="clock"><span id="clock"></span><span id="sunNow" class="sun-now"></span></div>
        <div class="time">
          <button id="live" class="chip" type="button"></button>
          <div class="speeds" role="group"></div>
          <button id="play" class="chip icon" type="button"></button>
          <button id="follow" class="chip" type="button" aria-pressed="true"></button>
          <button id="sunBtn" class="chip" type="button"></button>
          <button id="reset" class="chip" type="button"></button>
        </div>
      </section>
      <aside class="panel">
        <p class="intro"></p>
        <h2 class="choose"></h2>
        <div class="prayers" role="group"></div>
        <label class="more"><input type="checkbox" id="moreBox" /><span id="moreLabel"></span><small id="moreStatus" aria-live="polite"></small></label>
        <label class="size"><span id="sizeLabel"></span><input id="pinSize" type="range" min="0.5" max="3" step="0.1" value="1" /><output id="sizeOut"></output></label>
        <section class="card starting">
          <h3 id="startingTitle"></h3>
          <div id="startingList" class="places"></div>
        </section>
        <section class="card">
          <h3 id="inTimeTitle"></h3>
          <p id="moreLine" class="more-line" hidden></p>
          <p id="none" class="none" hidden></p>
          <ol id="mosqueList" class="mosques"></ol>
        </section>
        <section class="card">
          <h3 id="chartTitle"></h3>
          <svg id="chart" class="chart" viewBox="0 0 320 110" role="img"></svg>
          <p id="chartNote" class="small"></p>
        </section>
        <p class="small legend"></p>
        <p class="small dashed"></p>
        <p class="small method"></p>
      </aside>
    </main>
  </body>
</html>
