<!DOCTYPE html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>بەخشین — قورئانی پیرۆز</title>
    <meta name="description" content="بەشی بەخشین بۆ ئەپی «قورئانی پیرۆز — پەڕتووکی خودا»: خەزێنە، داواکارییە چالاکەکان، بەخشەران و خەرجییەکان — بە ڕاستەقینە کاتی و نوێبوونەوەی خۆکار.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="canonical" href="https://qurany-piroz.com/donations">

    <style media="screen">
      :root {
        --brand: #A97D19;
        --brand-dark: #8C6614;
        --on-brand: #FFFFFF;
        --bg: #F7F7FA;
        --surface: #FFFFFF;
        --text: #1D2231;
        --muted: #5B6272;
        --border: rgba(29, 34, 49, 0.14);
        --shadow: 0 18px 40px rgba(29, 34, 49, 0.12);
        --income: #1E8E5A;
        --expense: #C0392B;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #E2BD37;
          --brand-dark: #CBA62E;
          --on-brand: #1A1405;
          --bg: #12141C;
          --surface: #1D2231;
          --text: #F4F4F5;
          --muted: #A9AEBD;
          --border: rgba(226, 189, 55, 0.18);
          --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
          --income: #4CC38A;
          --expense: #E5766B;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      header.top {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 20px 8px;
      }

      header.top img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }

      header.top a {
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        font-size: 17px;
      }

      .back-link {
        margin-inline-start: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted) !important;
        font-weight: 600 !important;
        font-size: 14px !important;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 12px 20px 56px;
      }

      h1.page-title {
        font-size: 26px;
        font-weight: 700;
        margin: 12px 0 20px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 10px;
      }

      .muted { color: var(--muted); }
      .small { font-size: 13px; }

      .treasury-card {
        text-align: center;
      }

      .treasury-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--brand) 16%, transparent);
        color: var(--brand-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin: 0 auto 10px;
      }

      .treasury-balance {
        font-size: 26px;
        font-weight: 700;
        margin-top: 2px;
      }

      .pay-methods {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 14px;
      }

      .pay-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 5px 10px;
        border-radius: 8px;
        background: #FFFFFF;
        border: 1px solid var(--border);
      }

      .pay-badge img {
        height: 100%;
        width: auto;
        display: block;
      }

      .phone-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding: 8px 14px;
        border: none;
        border-radius: 20px;
        background: color-mix(in srgb, var(--brand) 14%, transparent);
        color: var(--brand-dark);
        font-weight: 700;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      .phone-chip .copy-icon { font-size: 13px; }

      @media (prefers-color-scheme: dark) {
        .phone-chip { color: var(--brand); }
        .treasury-icon { color: var(--brand); }
      }

      .progress-track {
        height: 8px;
        border-radius: 4px;
        background: var(--border);
        overflow: hidden;
        margin: 10px 0;
      }

      .progress-fill {
        height: 100%;
        background: var(--brand);
        border-radius: 4px;
        transition: width 0.4s ease;
      }

      .campaign-meta {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }

      .campaign-figures {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
      }

      .campaign-figures .remaining {
        font-weight: 700;
      }

      .description-html {
        font-size: 14px;
        line-height: 1.9;
      }

      .description-html img { max-width: 100%; height: auto; border-radius: 10px; }

      .name { font-size: 14px; }
      .amount { font-size: 14px; font-weight: 700; flex: none; }
      .amount.income { color: var(--income); }
      .amount.expense { color: var(--expense); }

      .simple-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
      }

      .simple-row:last-child { border-bottom: none; }

      .collapsible-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        font: inherit;
        color: inherit;
        text-align: inherit;
      }

      .collapsible-header h2 { margin: 0; }

      .collapsible-header .chevron {
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        transition: transform 0.2s ease;
      }

      .collapsible-header .chevron.open { transform: rotate(180deg); }

      .month-picker-row {
        margin: 12px 0 6px;
      }

      .month-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--brand) 10%, transparent);
        color: var(--brand-dark);
        border: none;
        font-weight: 700;
        font-size: 13.5px;
        font-family: inherit;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        .month-label { color: var(--brand); }
      }

      /* Not display:none — a fully-undisplayed input can refuse showPicker() in some browsers —
         just zero-sized and out of the flow, so the visible button above is what users interact
         with while this stays the actual control the click is directed at. */
      .month-input-hidden {
        position: absolute;
        width: 0;
        height: 0;
        border: none;
        padding: 0;
        opacity: 0;
      }

      .expense-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
      }

      .expense-row:last-child { border-bottom: none; }

      .expense-row .top-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .expense-row .date { font-size: 12px; }

      .empty-note {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 18px 0;
      }

      .skeleton {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 40px 0;
      }

      footer {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 0 24px 40px;
      }

      footer a { color: var(--muted); }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 12px);
        background: var(--text);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 100;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a href="/"><img src="logo.png" alt="لۆگۆی قورئانی پیرۆز"></a>
      <a href="/">قورئانی پیرۆز</a>
      <a class="back-link" href="/">گەڕانەوە ›</a>
    </header>

    <main>
      <h1 class="page-title">بەخشین</h1>

      <div id="content" aria-live="polite">
        <p class="skeleton">بارکردن...</p>
      </div>
      <!-- Split from #content above so toggling a collapsible or picking a month only touches
           these two cards' DOM — leaving the treasury card's logo <img> elements (and the rest
           of #content) untouched instead of being torn down and rebuilt on every unrelated tap. -->
      <div id="content-dynamic"></div>
    </main>

    <footer>
      © <span id="year"></span> قورئانی پیرۆز — پەڕتووکی خودا.
    </footer>

    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      document.getElementById('year').textContent = new Date().getFullYear();

      // Blocks the two forms of desktop zoom the viewport meta tag can't reach: trackpad pinch
      // (fires as wheel+ctrlKey in Chrome/Firefox/Edge) and the Ctrl/Cmd +/-/0 keyboard shortcuts.
      // Mobile pinch-zoom is handled by maximum-scale=1, user-scalable=no on that tag instead.
      document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
      });
      // Safari's own pinch-gesture events, separate from wheel+ctrlKey.
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());

      // Anon (public) key only — the same one already shipped inside the mobile apps' own
      // bundles, protected entirely by each table's RLS policy, never the service_role key Hevi
      // Edit uses to write. This page only ever selects.
      const supabase = createClient(
        'https://ugfipcwtkwmuukipmgst.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnZmlwY3d0a3dtdXVraXBtZ3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzE3MTIzODQsImV4cCI6MjA0NzI4ODM4NH0.oRKqjlM2mXTAsunBjSLRzcGjjWD12Wp8WZYony10en0'
      );

      const content = document.getElementById('content');
      const contentDynamic = document.getElementById('content-dynamic');

      function formatAmount(n) {
        const num = Number(n) || 0;
        return num.toLocaleString('en-US') + ' د.ع';
      }

      function formatDate(isoOrDateString) {
        return String(isoOrDateString).slice(0, 10);
      }

      const KURDISH_MONTHS = [
        'کانوونی دووەم', 'شوبات', 'ئازار', 'نیسان', 'ئایار', 'حوزەیران',
        'تەمووز', 'ئاب', 'ئەیلوول', 'تشرینی یەکەم', 'تشرینی دووەم', 'کانوونی یەکەم',
      ];

      function formatMonthLabel(yyyyMM) {
        const [y, m] = yyyyMM.split('-').map(Number);
        return `${KURDISH_MONTHS[m - 1]} ${y}`;
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      // Copies the treasury's payment-account number to the clipboard rather than dialing it —
      // it identifies a FIB/Qi/Fastpay account, not a number to call. Swaps the icon to a
      // checkmark briefly and shows a toast so the tap has visible confirmation.
      window.__copyPhone = function (button, number) {
        navigator.clipboard.writeText(number).then(() => {
          const icon = button.querySelector('.copy-icon');
          if (icon) {
            const original = icon.textContent;
            icon.textContent = '✅';
            setTimeout(() => { icon.textContent = original; }, 1500);
          }
          showToast('ژمارەکە لەبەرگیرایەوە.');
        });
      };

      let toastTimeoutId = null;

      function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'toast';
          toast.className = 'toast';
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        // Reflow so re-triggering the animation on a second tap actually restarts it, instead of
        // the class already being present and no transition firing.
        toast.classList.remove('show');
        void toast.offsetWidth;
        toast.classList.add('show');

        clearTimeout(toastTimeoutId);
        toastTimeoutId = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      // ---- Fetchers -----------------------------------------------------------------------

      async function fetchActiveCampaign() {
        const { data } = await supabase
          .from('donation_campaigns')
          .select()
          .eq('is_active', true)
          .order('created_at', { ascending: false })
          .limit(1);
        return data && data[0] ? data[0] : null;
      }

      async function fetchDonationsForCampaign(campaignId) {
        const { data } = await supabase
          .from('donations')
          .select()
          .eq('campaign_id', campaignId)
          .order('donated_at', { ascending: false });
        return data || [];
      }

      async function fetchUnlinkedDonations() {
        const { data } = await supabase
          .from('donations')
          .select()
          .is('campaign_id', null)
          .order('donated_at', { ascending: false });
        return data || [];
      }

      async function fetchTreasury() {
        const { data } = await supabase.from('app_treasury').select().eq('id', 1);
        return data && data[0] ? data[0] : null;
      }

      async function fetchExpenses() {
        const { data } = await supabase
          .from('treasury_expenses')
          .select()
          .order('spent_at', { ascending: false });
        return data || [];
      }

      // ---- Renderers ------------------------------------------------------------------------

      function treasuryCard(treasury) {
        if (!treasury) return '';
        // Real FIB/Qi/Fastpay marks, sourced from each company's own official site — nominative
        // use to identify accepted payment methods, not an endorsement claim. Each sits on a
        // small white chip so its true colors read correctly in dark mode too.
        //
        // A button that copies to the clipboard, not a tel: link — this number identifies the
        // FIB/Qi/Fastpay account to send to, it isn't meant to be dialed.
        //
        // dir="ltr" on the number itself, not just the chip: a plain phone number embedded in
        // RTL text is a run of "weak" bidi characters (digits/spaces), so the browser is free to
        // reorder its groups against the surrounding RTL paragraph — confirmed rendering as
        // "8781 544 0772" instead of "0772 544 8781" without this.
        const phone = treasury.contact_phone && treasury.contact_phone.trim()
          ? `
            <div class="pay-methods">
              <span class="pay-badge"><img src="fib-logo.svg" alt="FIB"></span>
              <span class="pay-badge"><img src="qi-logo.svg" alt="Qi"></span>
              <span class="pay-badge"><img src="fastpay-logo.png" alt="Fastpay"></span>
            </div>
            <button type="button" class="phone-chip" onclick="window.__copyPhone(this, '${escapeHtml(treasury.contact_phone)}')">
              <span dir="ltr">${escapeHtml(treasury.contact_phone)}</span>
              <span class="copy-icon">📋</span>
            </button>`
          : '';
        const note = treasury.note && treasury.note.trim()
          ? `<div class="muted small" style="margin-top:6px">${escapeHtml(treasury.note)}</div>`
          : '';
        return `
          <div class="card treasury-card">
            <div class="treasury-icon">🏛️</div>
            <div class="muted small">خەزێنەی ئێستای بەرنامە</div>
            <div class="treasury-balance">${formatAmount(treasury.balance)}</div>
            ${note}
            ${phone}
          </div>`;
      }

      function campaignCard(campaign, donations) {
        if (!campaign) return '';
        const given = donations.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
        const remaining = Math.max(0, (Number(campaign.target_amount) || 0) - given);
        const progress = campaign.target_amount > 0
          ? Math.min(100, Math.max(0, (given / campaign.target_amount) * 100))
          : 0;
        const description = campaign.description_html && campaign.description_html.trim()
          ? `<div class="card"><h2>ڕوونکردنەوە</h2><div class="description-html">${campaign.description_html}</div></div>`
          : '';

        return `
          <div class="card">
            <h2>${escapeHtml(campaign.beneficiary_name)}</h2>
            <div class="muted small">${formatDate(campaign.start_date)} — ${formatDate(campaign.end_date)}</div>
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="campaign-figures">
              <div class="remaining">ماوە: ${formatAmount(remaining)}</div>
              <div class="muted small">ئامانج: ${formatAmount(campaign.target_amount)}</div>
            </div>
          </div>
          ${description}
          <div class="card">
            <h2>چۆن ببەخشیت؟</h2>
            <p class="small">دەتوانیت بڕی پارەکە بنێریت بۆ ژمارەی دیاریکراو لە ڕێگەی FIB، Qi یان Fastpayـەوە. تکایە بڕی پارەکە و مەبەستی ناردنەکە بنووسە تاوەکو بتوانرێت وەک بەخشین تۆمار بکرێت.</p>
          </div>`;
      }

      function donorHistoryCard(title, donations) {
        if (!donations.length) return '';
        const rows = donations.map(d => donorRow(d)).join('');
        return `<div class="card"><h2>${title}</h2>${rows}</div>`;
      }

      function donorRow(d) {
        const name = d.donor_province ? `${escapeHtml(d.donor_name)} — ${escapeHtml(d.donor_province)}` : escapeHtml(d.donor_name);
        return `
          <div class="expense-row">
            <div class="top-line">
              <div class="name">${name}</div>
              <div class="amount income">${formatAmount(d.amount)}</div>
            </div>
            <div class="muted date">${formatDate(d.donated_at)}</div>
          </div>`;
      }

      // State for "بەخشینی خۆبەخشانە" only: collapsed by default, and — once opened — narrowed
      // to one month at a time (a tappable label swaps in the real underlying <input type="month">
      // that drives it) rather than dumping every spontaneous gift ever recorded into one list.
      let unlinkedExpanded = false;
      let selectedMonth = new Date().toISOString().slice(0, 7);

      function unlinkedDonationsCard(donations) {
        if (!donations.length) return '';

        const chevron = `<span class="chevron${unlinkedExpanded ? ' open' : ''}">⌄</span>`;
        const header = `
          <button type="button" class="collapsible-header" onclick="window.__toggleUnlinked()">
            <h2>بەخشینی خۆبەخشانە</h2>
            ${chevron}
          </button>`;

        if (!unlinkedExpanded) {
          return `<div class="card">${header}</div>`;
        }

        const filtered = donations.filter(d => String(d.donated_at).slice(0, 7) === selectedMonth);
        const rows = filtered.length
          ? filtered.map(d => donorRow(d)).join('')
          : `<p class="empty-note">هیچ بەخشینێکی خۆبەخشانە نییە بۆ ئەم مانگە</p>`;

        return `
          <div class="card">
            ${header}
            <div class="month-picker-row">
              <button type="button" class="month-label" onclick="window.__openMonthPicker()">📅 ${formatMonthLabel(selectedMonth)}</button>
              <input type="month" id="unlinked-month-input" class="month-input-hidden" value="${selectedMonth}"
                     aria-label="مانگ هەڵبژێرە" onchange="window.__onUnlinkedMonthChange(this.value)">
            </div>
            ${rows}
          </div>`;
      }

      window.__toggleUnlinked = function () {
        unlinkedExpanded = !unlinkedExpanded;
        renderDynamicFromCache();
      };

      // A transparent overlay input (tap-anywhere-on-the-label) turned out unreliable in real
      // testing — worked on iPhone Safari, silently did nothing in macOS Safari. Calling
      // showPicker() explicitly on a genuine click is the behavior every current browser actually
      // commits to supporting.
      window.__openMonthPicker = function () {
        const input = document.getElementById('unlinked-month-input');
        if (!input) return;
        if (typeof input.showPicker === 'function') {
          try {
            input.showPicker();
            return;
          } catch (err) {
            // Falls through to focus/click below — showPicker() throws if not called from a
            // direct user gesture, which this always is, but browsers vary.
          }
        }
        input.focus();
        input.click();
      };

      window.__onUnlinkedMonthChange = function (value) {
        if (!value) return;
        selectedMonth = value;
        renderDynamicFromCache();
      };

      // "بەخشەران" (Donators): every donor across every campaign and every spontaneous gift,
      // collapsed into one row per person with their running total and city — distinct from
      // donorHistoryCard/unlinkedDonationsCard above, which list individual transactions rather
      // than per-person totals. Collapsed by default, same as بەخشینی خۆبەخشانە.
      let donatorsExpanded = false;

      function aggregateDonors(campaignDonations, unlinkedDonations) {
        const totals = new Map();
        for (const d of [...campaignDonations, ...unlinkedDonations]) {
          const key = `${d.donor_name}||${d.donor_province || ''}`;
          const amount = Number(d.amount) || 0;
          const existing = totals.get(key);
          if (existing) {
            existing.total += amount;
          } else {
            totals.set(key, { name: d.donor_name, province: d.donor_province, total: amount });
          }
        }
        return Array.from(totals.values()).sort((a, b) => b.total - a.total);
      }

      function donatorsCard(campaignDonations, unlinkedDonations) {
        const donors = aggregateDonors(campaignDonations, unlinkedDonations);
        if (!donors.length) return '';

        // "بەخشەران (بە کۆی بەخشینەکانیشیانەوە)", not bare "بەخشەران": the active campaign's own
        // card already uses that word for its per-transaction list right above this one, so the
        // parenthetical ("with their donation totals too") is what tells the two apart — this one
        // is per-person totals, not individual transactions.
        const chevron = `<span class="chevron${donatorsExpanded ? ' open' : ''}">⌄</span>`;
        const header = `
          <button type="button" class="collapsible-header" onclick="window.__toggleDonators()">
            <h2>بەخشەران (بە کۆی بەخشینەکانیشیانەوە)</h2>
            ${chevron}
          </button>`;

        if (!donatorsExpanded) {
          return `<div class="card">${header}</div>`;
        }

        const rows = donors.map(d => {
          const name = d.province ? `${escapeHtml(d.name)} — ${escapeHtml(d.province)}` : escapeHtml(d.name);
          return `<div class="simple-row"><div class="name">${name}</div><div class="amount income">${formatAmount(d.total)}</div></div>`;
        }).join('');

        return `<div class="card">${header}${rows}</div>`;
      }

      window.__toggleDonators = function () {
        donatorsExpanded = !donatorsExpanded;
        renderDynamicFromCache();
      };

      function expensesCard(expenses) {
        if (!expenses.length) return '';
        const rows = expenses.map(e => `
          <div class="expense-row">
            <div class="top-line">
              <div class="name">${escapeHtml(e.description)}</div>
              <div class="amount expense">${formatAmount(e.amount)}</div>
            </div>
            <div class="muted date">${formatDate(e.spent_at)}</div>
          </div>`).join('');
        return `<div class="card"><h2>خەرجییەکانی خەزێنە</h2>${rows}</div>`;
      }

      // ---- Full render ------------------------------------------------------------------------

      // Last-fetched data, kept around so the collapsible/month-picker state above can re-render
      // instantly from cache (no network round trip) instead of going through fetchAndRenderAll
      // — which is reserved for an actual page load or a Realtime change notification.
      let lastCampaign = null;
      let lastTreasury = null;
      let lastCampaignDonations = [];
      let lastUnlinked = [];
      let lastExpenses = [];

      async function fetchAndRenderAll() {
        const [campaign, treasury, unlinked, expenses] = await Promise.all([
          fetchActiveCampaign(),
          fetchTreasury(),
          fetchUnlinkedDonations(),
          fetchExpenses(),
        ]);
        lastCampaign = campaign;
        lastTreasury = treasury;
        lastUnlinked = unlinked;
        lastExpenses = expenses;
        lastCampaignDonations = campaign ? await fetchDonationsForCampaign(campaign.id) : [];
        renderFromCache();
      }

      // Two containers, two render functions: بەخشینی خۆبەخشانە and هەموو بەخشەران are the only
      // cards whose markup depends on UI-only state (unlinkedExpanded/selectedMonth,
      // donatorsExpanded), so they alone live in #content-dynamic and re-render on every toggle
      // or month change. The rest — including the treasury card's FIB/Qi/Fastpay logo <img>
      // elements — sits in #content and is left alone unless the underlying data actually
      // changed, so tapping a collapsible header no longer tears down and re-fetches those
      // images (confirmed visible as a "reload" flash before this split).
      function renderStaticFromCache() {
        content.innerHTML = [
          treasuryCard(lastTreasury),
          expensesCard(lastExpenses),
          campaignCard(lastCampaign, lastCampaignDonations),
          donorHistoryCard('بەخشەران', lastCampaignDonations),
        ].join('');
      }

      function renderDynamicFromCache() {
        contentDynamic.innerHTML = [
          unlinkedDonationsCard(lastUnlinked),
          donatorsCard(lastCampaignDonations, lastUnlinked),
        ].join('');
      }

      function renderFromCache() {
        renderStaticFromCache();
        renderDynamicFromCache();
      }

      fetchAndRenderAll();

      // ---- Realtime: re-fetch and re-render whenever any of these tables change, so the page
      // never needs a manual refresh to reflect what Hevi Edit just published or a visitor's
      // donation. Toggling the collapsible section or picking a month re-renders from cache
      // instead (see renderFromCache) — only an actual data change re-fetches. ------------------
      supabase
        .channel('public:donations-page')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'donation_campaigns' }, fetchAndRenderAll)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'donations' }, fetchAndRenderAll)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_treasury' }, fetchAndRenderAll)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'treasury_expenses' }, fetchAndRenderAll)
        .subscribe();
    </script>
  </body>
</html>
